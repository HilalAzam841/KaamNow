<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0E7C66">
  <title>KaamNow: offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #F5FAF7; font-family: system-ui, sans-serif; color: #1b2b26; text-align: center; }
    main { padding: 24px; max-width: 360px; }
    img { width: 80px; height: 80px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 4px 0; color: #4a5a55; }
    .ur { direction: rtl; font-size: 18px; }
    button { margin-top: 20px; padding: 12px 28px; border: 0; border-radius: 24px; background: #0E7C66;
             color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/Icon-192.png" alt="KaamNow">
    <h1>You are offline</h1>
    <p>Check your internet connection and try again.</p>
    <p class="ur" lang="ur">آپ آف لائن ہیں۔ انٹرنیٹ کنکشن چیک کر کے دوبارہ کوشش کریں۔</p>
    <button onclick="location.reload()">Try again · دوبارہ کوشش کریں</button>
  </main>
</body>
</html>
