<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. Must start and end with "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Post a job, compare offers from verified workers in Lahore, and book at your price.">
  <meta name="theme-color" content="#0E7C66">

  <!-- Installed app (home screen) -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KaamNow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>KaamNow</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F5FAF7; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 16px; font-family: system-ui, sans-serif; color: #0E7C66; }
    #splash img { width: 96px; height: 96px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #cfe5dc; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #0E7C66;
                          animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
  <script>
    // "Install app": the browser offers installation through this event (Chrome, Edge, Android).
    // The Flutter app reads window.kaamnowInstall (see lib/core/install_web.dart).
    window.kaamnowInstall = {
      prompt: null,
      installed: false,
      standalone: window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
    };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.kaamnowInstall.prompt = e;
      window.dispatchEvent(new Event('kaamnow-install-changed'));
    });
    window.addEventListener('appinstalled', function () {
      window.kaamnowInstall.prompt = null;
      window.kaamnowInstall.installed = true;
      window.dispatchEvent(new Event('kaamnow-install-changed'));
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Service worker:', e); });
      });
    }
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/Icon-192.png" alt=""><div class="bar"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
