name: kaamnow
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  go_router: ^18.1.4
  google_maps_flutter: ^2.19.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  material_ui: ^1.1.0
  provider: ^6.1.5+1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  web: ^1.1.2
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Noto Nastaliq Urdu (SIL Open Font License, see assets/fonts/OFL.txt), used when the app is in Urdu.
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-400.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-700.ttf
          weight: 700
