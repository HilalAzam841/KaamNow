name: android

# Builds the Android app (APK) on every pull request and push to main, and runs it on an Android
# emulator against a real backend with the demo accounts.
#
# The APK is attached to each run under "Artifacts" (kaamnow-android). It talks to the server in
# the repository variable ANDROID_API_URL (Settings, Secrets and variables, Actions, Variables),
# default https://kaamnow.pk. To sign it for the Play Store, add the secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD
# (see app/README.md); without them it is signed with a test key, fine for installing directly.
#
# Push notifications on the phone are switched on by the FIREBASE_* repository variables
# (see "Push notifications on phones" in app/README.md); without them the app works, minus push.
# The repository variable GOOGLE_MAPS_API_KEY switches the maps to Google Maps (app/README.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      API_URL: ${{ vars.ANDROID_API_URL || 'https://kaamnow.pk' }}
      GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # the Android build tools (lint) need Java 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - name: Release signing key (only when the secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kaamnow.jks"
          echo "KAAMNOW_KEYSTORE=$RUNNER_TEMP/kaamnow.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build APK
        env:
          KAAMNOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAAMNOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KAAMNOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=$API_URL
          --dart-define=GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }} --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }} --dart-define=FIREBASE_IOS_APP_ID=${{ vars.FIREBASE_IOS_APP_ID }}
          --build-number=${{ github.run_number }}
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/kaamnow-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: kaamnow-android
          path: app/build/kaamnow-${{ github.run_number }}.apk
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kaamnow
          POSTGRES_USER: kaamnow
          POSTGRES_PASSWORD: kaamnow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kaamnow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key
      # The emulator reaches the computer it runs on as 10.0.2.2.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,10.0.2.2
      POSTGRES_DB: kaamnow
      POSTGRES_USER: kaamnow
      POSTGRES_PASSWORD: kaamnow
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start the backend with demo accounts
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_demo_data
          nohup daphne -b 0.0.0.0 -p 8000 config.asgi:application > "$RUNNER_TEMP/daphne.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/v1/app/config/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/v1/app/config/ > /dev/null
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"  # the Android build tools (lint) need Java 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Run the app on an Android 14 emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          cores: 4
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: ./integration_test/run_on_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: app/build/android-shots/
          if-no-files-found: ignore
      - name: Backend log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/daphne.log"
