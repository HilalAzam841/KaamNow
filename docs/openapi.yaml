      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommissionList'
          description: ''
  /api/v1/admin/complaints/:
    get:
      operationId: admin_complaints_list
      parameters:
      - in: query
        name: against_user
        schema:
          type: integer
      - in: query
        name: booking
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
          enum:
          - app_issue
          - behaviour
          - damage
          - fraud
          - no_show
          - other
          - overcharging
          - payment
          - service_quality
        description: |-
          * `service_quality` - Poor service quality
          * `no_show` - Worker did not arrive
          * `overcharging` - Overcharging
          * `behaviour` - Rude or unsafe behaviour
          * `payment` - Payment issue
          * `damage` - Property damage
          * `fraud` - Fraud
          * `app_issue` - App problem
          * `other` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: raised_by
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_review
          - open
          - rejected
          - resolved
        description: |-
          * `open` - Open
          * `in_review` - In review
          * `resolved` - Resolved
          * `rejected` - Rejected
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminComplaintList'
          description: ''
  /api/v1/admin/complaints/{id}/:
