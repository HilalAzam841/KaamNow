        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - category_name
      - created_at
      - id
      - is_sponsored
      - worker_completed_jobs
      - worker_experience_years
      - worker_id
      - worker_is_verified
      - worker_name
      - worker_rating
      - worker_service_area
    WorkerServiceInline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        description:
          type: string
          maxLength: 1000
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
      required:
      - category
      - category_name
      - id
    WorkerServiceInlineRequest:
      type: object
      properties:
        category:
          type: integer
        description:
          type: string
          maxLength: 1000
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
      required:
      - category
    WorkerServiceRequest:
      type: object
      properties:
        category:
          type: integer
        description:
          type: string
          maxLength: 1000
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
      required:
      - category
    WorkerSlot:
