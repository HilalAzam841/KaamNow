    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_name:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/AuditLogActionEnum'
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_name
      - created_at
      - id
      - ip_address
      - metadata
      - target_id
      - target_type
    AuditLogActionEnum:
      enum:
      - worker_verified
      - worker_rejected
      - document_viewed
      - user_suspended
      - user_reactivated
      - commission_changed
      - category_changed
      - settings_changed
      - plan_changed
      - subscription_activated
      - featured_cancelled
      - complaint_updated
      - payment_disputed
      type: string
      description: |-
        * `worker_verified` - Worker verified
        * `worker_rejected` - Worker rejected
        * `document_viewed` - Worker document viewed
        * `user_suspended` - User suspended
        * `user_reactivated` - User reactivated
        * `commission_changed` - Commission rate changed
        * `category_changed` - Service category changed
        * `settings_changed` - Platform settings changed
        * `plan_changed` - Subscription or featured plan changed
        * `subscription_activated` - Subscription activated manually
        * `featured_cancelled` - Featured listing cancelled
        * `complaint_updated` - Complaint status changed
        * `payment_disputed` - Payment flagged as disputed
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          type: object
          additionalProperties:
            type: string
      required:
      - tokens
      - user
    AvailabilityRequest:
      type: object
      properties:
        is_available:
          type: boolean
      required:
      - is_available
    Booking:
      type: object
      description: |-
        Booking view for its customer, its worker and admins.

        Contact details (phone, exact address) are only included for the other
        party while the booking is active. OTP fields are never serialised.
      properties:
        id:
          type: integer
          readOnly: true
        request_id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        category_name:
          type: string
          readOnly: true
        preferred_time:
          type: string
          format: date-time
          readOnly: true
        agreed_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        emergency_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        worker:
          allOf:
          - $ref: '#/components/schemas/PublicWorker'
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        contact:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        on_the_way_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        arrived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancel_reason:
          type: string
          readOnly: true
        completed_via:
          type: string
          readOnly: true
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/BookingStatusLog'
          readOnly: true
        commission:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        has_review:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agreed_price
      - arrived_at
      - cancel_reason
      - cancelled_at
      - category_name
      - commission
      - completed_at
      - completed_via
      - contact
      - created_at
      - customer_name
      - emergency_fee
      - has_review
      - id
      - on_the_way_at
      - preferred_time
      - request_id
      - started_at
      - status
      - status_history
      - title
      - total_amount
      - updated_at
      - worker
    BookingCancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - reason
    BookingCompleteRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 1
          description: Required when the worker completes.
