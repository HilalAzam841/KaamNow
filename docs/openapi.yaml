components:
  schemas:
    AddFavouriteRequest:
      type: object
      properties:
        worker:
          type: integer
      required:
      - worker
    AdminComplaint:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          type: integer
          readOnly: true
          nullable: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        subject:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ComplaintStatusEnum'
          readOnly: true
        resolution:
          type: string
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        raised_by:
          type: integer
          readOnly: true
        raised_by_name:
          type: string
          readOnly: true
        raised_by_role:
          type: string
          readOnly: true
        against_user:
          type: integer
          readOnly: true
          nullable: true
        against_user_name:
          type: string
          readOnly: true
        resolved_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - against_user
      - against_user_name
      - booking
      - category
      - created_at
      - description
      - id
      - raised_by
      - raised_by_name
      - raised_by_role
      - resolution
      - resolved_at
      - resolved_by
      - status
      - subject
      - updated_at
    AdminNoShow:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          type: integer
          readOnly: true
        booking_title:
          type: string
          readOnly: true
        preferred_time:
          type: string
          format: date-time
          readOnly: true
        side:
          allOf:
          - $ref: '#/components/schemas/SideEnum'
          readOnly: true
          description: |-
            Who did not show up.

            * `worker` - Worker did not come
            * `customer` - Customer was not there
        reported_by:
          type: integer
          readOnly: true
        reported_by_name:
          type: string
          readOnly: true
        against:
          type: integer
          readOnly: true
        against_name:
          type: string
          readOnly: true
        against_role:
          type: string
          readOnly: true
        against_total:
          type: integer
          description: No-shows against this person that were not dismissed, this
            one included.
          readOnly: true
        note:
          type: string
          readOnly: true
        review:
          allOf:
          - $ref: '#/components/schemas/AdminNoShowReviewEnum'
          readOnly: true
        admin_note:
          type: string
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - admin_note
      - against
      - against_name
      - against_role
      - against_total
      - booking
      - booking_title
      - created_at
      - id
      - note
      - preferred_time
      - reported_by
      - reported_by_name
      - review
