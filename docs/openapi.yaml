openapi: 3.0.3
info:
  title: KaamNow API
  version: 1.0.0
  description: |-
    On-demand local services marketplace (Lahore, Pakistan). Customers post service requests, nearby verified workers bid, both sides negotiate, and the customer books.

    All responses use the envelope `{success, data, message}` on success and `{success: false, error: {code, message, details}}` on failure.
paths:
  /api/v1/addresses/:
    get:
      operationId: addresses_list
      summary: Your saved addresses, the default first.
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedAddress'
          description: ''
    post:
      operationId: addresses_create
      summary: Save an address (up to 10; one Home and one Work). The first one becomes
        the default.
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SavedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SavedAddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
          description: ''
  /api/v1/addresses/{id}/:
    get:
      operationId: addresses_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
          description: ''
    patch:
      operationId: addresses_partial_update
      summary: Change a saved address.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSavedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSavedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSavedAddressRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
          description: ''
    delete:
      operationId: addresses_destroy
      summary: Delete a saved address. If it was the default, the oldest one left
        becomes the default.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/addresses/{id}/make-default/:
    post:
      operationId: addresses_make_default_create
      summary: Use this address first when posting a job.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
          description: ''
  /api/v1/admin/audit-logs/:
    get:
      operationId: admin_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - cancellation_fee_settled
          - category_changed
          - commission_changed
          - commission_collected
          - complaint_updated
          - document_viewed
          - featured_cancelled
          - no_show_reviewed
          - package_moderated
          - payment_disputed
          - payment_refunded
          - payment_resolved
          - payout_paid
          - payout_rejected
          - plan_changed
          - portfolio_moderated
          - promo_saved
          - review_moderated
          - settings_changed
          - sos_handled
          - subscription_activated
          - user_reactivated
          - user_suspended
          - worker_rejected
          - worker_verified
        description: |-
          * `worker_verified` - Worker verified
          * `worker_rejected` - Worker rejected
          * `document_viewed` - Worker document viewed
          * `user_suspended` - User suspended
          * `user_reactivated` - User reactivated
          * `commission_changed` - Commission rate changed
          * `category_changed` - Service category changed
          * `settings_changed` - Platform settings changed
          * `plan_changed` - Subscription or featured plan changed
          * `subscription_activated` - Subscription activated manually
          * `featured_cancelled` - Featured listing cancelled
          * `complaint_updated` - Complaint status changed
          * `payment_disputed` - Payment flagged as disputed
          * `payout_paid` - Worker payout marked as paid
          * `payout_rejected` - Worker payout rejected
          * `commission_collected` - Cash commission received from worker
          * `payment_resolved` - Disputed payment resolved
          * `payment_refunded` - Payment refunded to customer
          * `promo_saved` - Promo code created or changed
          * `no_show_reviewed` - No-show report reviewed
          * `sos_handled` - SOS alert handled
          * `portfolio_moderated` - Portfolio photo hidden or shown
          * `package_moderated` - Service package hidden or shown
          * `cancellation_fee_settled` - Cancellation fee waived or recorded as paid
          * `review_moderated` - Review, review photo or reply hidden or shown
      - in: query
        name: actor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/bookings/:
    get:
      operationId: admin_bookings_list
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - arrived
          - cancelled
          - completed
          - confirmed
          - in_progress
          - on_the_way
        description: |-
          * `confirmed` - Confirmed
          * `on_the_way` - On the way
          * `arrived` - Arrived
          * `in_progress` - Work started
          * `completed` - Completed
          * `cancelled` - Cancelled
      - in: query
        name: worker
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
  /api/v1/admin/cancellation-fees/:
    get:
      operationId: admin_cancellation_fees_list
      description: Every late cancellation fee, newest first.
      parameters:
      - in: query
        name: customer
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: reason
        schema:
          type: string
          enum:
          - arrived
          - late
          - on_the_way
        description: |-
          * `late` - Cancelled close to the start time
          * `on_the_way` - Cancelled after the worker set off
          * `arrived` - Cancelled after the worker arrived
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - owed
          - paid
          - waived
        description: |-
          * `owed` - Owed
          * `paid` - Paid
          * `waived` - Waived
      - in: query
        name: worker
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCancellationFeeList'
          description: ''
  /api/v1/admin/cancellation-fees/{id}/record-received/:
    post:
      operationId: admin_cancellation_fees_record_received_create
      description: Every late cancellation fee, newest first.
      summary: Record a fee paid at the office or by transfer (audited). The worker's
        share goes to their wallet.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cancellation fee.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordReceivedRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordReceivedRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordReceivedRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCancellationFee'
          description: ''
  /api/v1/admin/cancellation-fees/{id}/waive/:
    post:
      operationId: admin_cancellation_fees_waive_create
      description: Every late cancellation fee, newest first.
      summary: Waive a fee (audited). The customer is told.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
