openapi: 3.0.3
info:
  title: KaamNow API
  version: 1.0.0
  description: |-
    On-demand local services marketplace (Lahore, Pakistan). Customers post service requests, nearby verified workers bid, both sides negotiate, and the customer books.

    All responses use the envelope `{success, data, message}` on success and `{success: false, error: {code, message, details}}` on failure.
paths:
  /api/v1/admin/audit-logs/:
    get:
      operationId: admin_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - category_changed
          - commission_changed
          - complaint_updated
          - document_viewed
          - featured_cancelled
          - payment_disputed
          - plan_changed
          - settings_changed
          - subscription_activated
          - user_reactivated
          - user_suspended
          - worker_rejected
          - worker_verified
        description: |-
          * `worker_verified` - Worker verified
          * `worker_rejected` - Worker rejected
          * `document_viewed` - Worker document viewed
          * `user_suspended` - User suspended
          * `user_reactivated` - User reactivated
          * `commission_changed` - Commission rate changed
          * `category_changed` - Service category changed
          * `settings_changed` - Platform settings changed
          * `plan_changed` - Subscription or featured plan changed
          * `subscription_activated` - Subscription activated manually
          * `featured_cancelled` - Featured listing cancelled
          * `complaint_updated` - Complaint status changed
          * `payment_disputed` - Payment flagged as disputed
      - in: query
        name: actor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
