    WorkerServiceInlineRequest:
      type: object
      properties:
        category:
          type: integer
        description:
          type: string
          maxLength: 1000
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
      required:
      - category
    WorkerServiceRequest:
      type: object
      properties:
        category:
          type: integer
        description:
          type: string
          maxLength: 1000
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
      required:
      - category
