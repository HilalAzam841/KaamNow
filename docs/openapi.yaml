          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TrailPoint:
      type: object
      properties:
        latitude:
          type: string
        longitude:
          type: string
        recorded_at:
          type: string
          format: date-time
      required:
      - latitude
      - longitude
      - recorded_at
    TypeEnum:
      enum:
      - new_request
      - new_offer
      - negotiation
      - offer_accepted
      - offer_rejected
      - offer_closed
      - booking_status
      - booking_cancelled
      - booking_completed
      - request_cancelled
      - payment
      - chat_message
      - subscription
      - featured
      - complaint
      - review
      - verification
      - reminder
      - no_show
      - system
      type: string
      description: |-
        * `new_request` - New nearby request
        * `new_offer` - New offer
        * `negotiation` - Negotiation update
        * `offer_accepted` - Offer accepted
        * `offer_rejected` - Offer rejected
        * `offer_closed` - Offer closed
        * `booking_status` - Booking status
        * `booking_cancelled` - Booking cancelled
        * `booking_completed` - Booking completed
        * `request_cancelled` - Request cancelled
        * `payment` - Payment
        * `chat_message` - New chat message
        * `subscription` - Subscription
        * `featured` - Featured listing
        * `complaint` - Complaint update
        * `review` - Review
        * `verification` - Account verification
        * `reminder` - Booking reminder
        * `no_show` - No-show report
        * `system` - System
    User:
      type: object
      description: The authenticated user's own account (includes private fields).
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
        phone_verified:
          type: boolean
          readOnly: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        full_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
        default_address:
          type: string
          maxLength: 255
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            Language for alerts and server messages. The app keeps it in sync with the user's choice.

            * `en` - English
            * `ur` - اردو
        booking_reminders:
          type: boolean
          description: Send reminders the day before and an hour before a booked job.
        worker_profile_id:
          type: integer
          nullable: true
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - full_name
      - id
      - phone
      - phone_verified
      - role
      - worker_profile_id
    UserRoleEnum:
      enum:
      - customer
      - worker
      - admin
      type: string
      description: |-
        * `customer` - Customer
        * `worker` - Service provider
        * `admin` - Administrator
    VerificationStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `pending` - Pending review
        * `verified` - Verified
        * `rejected` - Rejected
    Wallet:
      type: object
      properties:
        earnings_held:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Your share of online payments, held by KaamNow.
        commission_owed:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Commission on jobs paid to you in cash.
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: 'Positive: KaamNow owes you. Negative: you owe KaamNow.'
        min_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        commission_debt_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        can_request_payout:
          type: boolean
        must_pay_commission:
          type: boolean
        offers_blocked:
          type: boolean
        open_settlement:
          allOf:
          - $ref: '#/components/schemas/Settlement'
          nullable: true
        last_payout_account:
          allOf:
          - $ref: '#/components/schemas/LastPayoutAccount'
          nullable: true
        settlements:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
      required:
      - balance
      - can_request_payout
      - commission_debt_limit
      - commission_owed
      - earnings_held
      - last_payout_account
      - min_payout
      - must_pay_commission
      - offers_blocked
      - open_settlement
      - settlements
    WebPushKeysRequest:
      type: object
      properties:
        p256dh:
          type: string
          minLength: 1
          maxLength: 100
        auth:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - auth
      - p256dh
    WebPushSubscribeRequest:
      type: object
      description: The browser's PushSubscription.toJSON(), as is.
      properties:
        endpoint:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
        keys:
          $ref: '#/components/schemas/WebPushKeysRequest'
      required:
      - endpoint
      - keys
    WebPushUnsubscribeRequest:
      type: object
      properties:
        endpoint:
          type: string
          format: uri
          minLength: 1
          maxLength: 1000
      required:
      - endpoint
    WeekdayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Monday
        * `1` - Tuesday
        * `2` - Wednesday
        * `3` - Thursday
        * `4` - Friday
        * `5` - Saturday
        * `6` - Sunday
    WorkerBalance:
      type: object
      properties:
        worker:
          type: integer
        worker_name:
          type: string
        worker_phone:
          type: string
        earnings_held:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        commission_owed:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - balance
      - commission_owed
      - earnings_held
      - worker
      - worker_name
      - worker_phone
    WorkerDocument:
      type: object
      description: Metadata only. The file itself is private and never returned as
        a URL.
      properties:
        id:
          type: integer
          readOnly: true
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        original_filename:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WorkerDocumentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - document_type
      - id
      - original_filename
      - status
    WorkerDocumentRequest:
      type: object
      description: Metadata only. The file itself is private and never returned as
        a URL.
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        file:
          type: string
          format: binary
          writeOnly: true
      required:
      - document_type
      - file
    WorkerDocumentStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    WorkerOffer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        request:
          type: integer
          readOnly: true
        worker:
          allOf:
          - $ref: '#/components/schemas/PublicWorker'
          readOnly: true
        initial_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        current_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Latest price on the table in the negotiation.
        awaiting:
          allOf:
          - $ref: '#/components/schemas/PartyEnum'
          readOnly: true
          description: |-
            Which party must respond next.

            * `customer` - Customer
            * `worker` - Worker
        estimated_arrival_minutes:
          type: integer
          readOnly: true
        message:
          type: string
          readOnly: true
        additional_info:
          type: string
          readOnly: true
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/WorkerOfferStatusEnum'
          readOnly: true
        negotiations:
          type: array
          items:
            $ref: '#/components/schemas/Negotiation'
          readOnly: true
        booking_id:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - additional_info
      - awaiting
      - booking_id
      - created_at
      - current_price
      - distance_km
      - estimated_arrival_minutes
      - id
      - initial_price
      - message
      - negotiations
      - request
      - status
      - updated_at
      - worker
    WorkerOfferStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      - withdrawn
      - closed
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected by customer
        * `withdrawn` - Withdrawn by worker
        * `closed` - Closed
    WorkerProfile:
      type: object
      description: The worker's own profile (private view).
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        cnic_number:
          type: string
          maxLength: 13
        bio:
          type: string
          maxLength: 2000
        experience_years:
          type: integer
          maximum: 60
          minimum: 0
        profile_picture:
          type: string
          format: uri
          nullable: true
        base_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        base_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        service_area:
          type: string
          description: e.g. Gulberg, Lahore
          maxLength: 255
        service_radius_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_available:
          type: boolean
          readOnly: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
        completed_jobs_count:
          type: integer
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/WorkerServiceInline'
          readOnly: true
        documents_uploaded:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - average_rating
      - cnic_number
      - completed_jobs_count
      - created_at
      - documents_uploaded
      - full_name
      - id
      - is_available
      - phone
      - rating_count
      - rejection_reason
      - services
      - verification_status
      - verified_at
    WorkerService:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        category_name:
          type: string
          readOnly: true
        description:
          type: string
          maxLength: 1000
        starting_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        is_active:
          type: boolean
        worker_id:
          type: integer
          readOnly: true
        worker_name:
          type: string
          readOnly: true
        worker_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        worker_completed_jobs:
          type: integer
          readOnly: true
        worker_experience_years:
          type: integer
          readOnly: true
        worker_is_verified:
          type: boolean
          readOnly: true
        worker_service_area:
          type: string
          readOnly: true
        is_sponsored:
          type: boolean
          readOnly: true
          default: false
