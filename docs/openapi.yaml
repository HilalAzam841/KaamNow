          application/json:
            schema:
              $ref: '#/components/schemas/WaiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WaiveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WaiveRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCancellationFee'
          description: ''
  /api/v1/admin/commissions/:
    get:
      operationId: admin_commissions_list
      parameters:
      - in: query
