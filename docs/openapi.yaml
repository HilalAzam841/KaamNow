        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_review
          - open
          - rejected
          - resolved
        description: |-
          * `open` - Open
          * `in_review` - In review
          * `resolved` - Resolved
          * `rejected` - Rejected
