        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComplaintStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComplaintStatusRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComplaint'
          description: ''
  /api/v1/admin/dashboard/:
