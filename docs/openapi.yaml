        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - arrived
          - cancelled
          - completed
          - confirmed
          - in_progress
          - on_the_way
        description: |-
          * `confirmed` - Confirmed
          * `on_the_way` - On the way
          * `arrived` - Arrived
          * `in_progress` - Work started
          * `completed` - Completed
          * `cancelled` - Cancelled
      - in: query
