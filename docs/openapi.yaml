          - service_quality
        description: |-
          * `service_quality` - Poor service quality
          * `no_show` - Worker did not arrive
          * `overcharging` - Overcharging
          * `behaviour` - Rude or unsafe behaviour
          * `payment` - Payment issue
          * `damage` - Property damage
          * `fraud` - Fraud
          * `app_issue` - App problem
          * `other` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
