    PatchedAdminPromoCodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Stored in capitals; customers can type any case.
          maxLength: 30
        description:
          type: string
          description: Shown to customers, e.g. 'Eid offer'.
          maxLength: 200
        kind:
          $ref: '#/components/schemas/AdminPromoCodeKindEnum'
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Percent (1-100) or rupees.
        max_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          description: Upper limit in rupees for percent codes.
        min_order:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Smallest booking total the code works on.
        category:
          type: integer
          nullable: true
          description: Only for this service, if set.
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        max_uses:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: 'Total uses for everyone. Empty: no limit.'
        max_uses_per_user:
          type: integer
          maximum: 32767
          minimum: 0
        first_booking_only:
          type: boolean
          description: Only for customers who have never paid a booking.
        is_active:
          type: boolean
    PatchedFeaturedPlanRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        duration_days:
          type: integer
          maximum: 32767
          minimum: 1
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_active:
          type: boolean
    PatchedMyPackageRequest:
      type: object
      description: A package as its worker sees and edits it.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 600
        includes:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 8
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        duration_minutes:
          type: integer
          maximum: 480
          minimum: 30
        category:
          type: integer
        is_active:
          type: boolean
          description: Paused packages are not shown to customers.
    PatchedOfferUpdateRequest:
      type: object
      properties:
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        estimated_arrival_minutes:
          type: integer
          maximum: 1440
          minimum: 5
        message:
          type: string
          maxLength: 500
        additional_info:
          type: string
          maxLength: 1000
    PatchedPlatformSettingsRequest:
      type: object
      properties:
        commission_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        emergency_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Flat fee added to emergency (urgent) bookings. Kept by the
            platform.
        emergency_enabled:
          type: boolean
        min_payout:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Smallest balance a worker can ask to be paid out.
        commission_debt_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Workers who owe more cash commission than this cannot send
            offers until they pay. 0 = no limit.
        referral_reward:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Given to the inviter when the person they invited pays their
            first booking. 0 turns it off.
        referral_welcome_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Credit a new customer gets for signing up with an invite code.
        referral_min_booking:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: The first booking must be at least this much for the inviter
            to be rewarded.
        max_discount_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Promo codes and credit together can take at most this share
            off a booking.
        reminder_sms_enabled:
          type: boolean
          description: Also send the one-hour job reminder by SMS (costs money per
            message). Push and in-app reminders are always sent.
        no_show_grace_minutes:
          type: integer
          maximum: 180
          minimum: 10
          description: How long after the start time (worker) or after arriving (customer)
            a no-show can be reported.
        cancellation_fee_enabled:
          type: boolean
          description: Charge customers who cancel late. The fee goes to the worker,
            less commission.
        cancellation_free_minutes:
          type: integer
          maximum: 60
          minimum: 0
          description: Cancelling this soon after booking is always free (the customer
            changed their mind).
        cancellation_window_minutes:
          type: integer
          maximum: 1440
          minimum: 15
          description: Cancelling less than this long before the start time costs
            the late fee.
        late_cancellation_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Fee for cancelling inside the window, before the worker sets
            off. 0 turns it off.
