      description: |-
        * `worker_verified` - Worker verified
        * `worker_rejected` - Worker rejected
        * `document_viewed` - Worker document viewed
        * `user_suspended` - User suspended
        * `user_reactivated` - User reactivated
        * `commission_changed` - Commission rate changed
        * `category_changed` - Service category changed
        * `settings_changed` - Platform settings changed
        * `plan_changed` - Subscription or featured plan changed
        * `subscription_activated` - Subscription activated manually
        * `featured_cancelled` - Featured listing cancelled
        * `complaint_updated` - Complaint status changed
        * `payment_disputed` - Payment flagged as disputed
        * `payout_paid` - Worker payout marked as paid
        * `payout_rejected` - Worker payout rejected
        * `commission_collected` - Cash commission received from worker
        * `payment_resolved` - Disputed payment resolved
        * `payment_refunded` - Payment refunded to customer
        * `promo_saved` - Promo code created or changed
        * `no_show_reviewed` - No-show report reviewed
        * `sos_handled` - SOS alert handled
        * `portfolio_moderated` - Portfolio photo hidden or shown
        * `package_moderated` - Service package hidden or shown
        * `cancellation_fee_settled` - Cancellation fee waived or recorded as paid
        * `review_moderated` - Review, review photo or reply hidden or shown
