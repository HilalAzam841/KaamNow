  /api/v1/admin/no-shows/:
    get:
      operationId: admin_no_shows_list
      description: No-show reports. Each row shows how many no-shows the reported
        person has in total.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: review
        schema:
          type: string
          enum:
          - confirmed
          - dismissed
          - open
        description: |-
          * `open` - Not reviewed
          * `confirmed` - Confirmed
          * `dismissed` - Dismissed
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: side
        schema:
          type: string
          enum:
          - customer
          - worker
        description: |-
          Who did not show up.

          * `worker` - Worker did not come
          * `customer` - Customer was not there
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminNoShowList'
          description: ''
  /api/v1/admin/no-shows/{id}/:
    get:
      operationId: admin_no_shows_retrieve
