          format: date-time
        free:
          type: boolean
      required:
      - end
      - free
      - start
    WorkerSubscription:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        worker:
          type: integer
          readOnly: true
        worker_name:
          type: string
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/SubscriptionPlan'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PurchaseStatusEnum'
          readOnly: true
