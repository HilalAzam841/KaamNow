openapi: 3.0.3
info:
  title: KaamNow API
  version: 1.0.0
  description: |-
    On-demand local services marketplace (Lahore, Pakistan). Customers post service requests, nearby verified workers bid, both sides negotiate, and the customer books.

    All responses use the envelope `{success, data, message}` on success and `{success: false, error: {code, message, details}}` on failure.
paths:
  /api/v1/admin/audit-logs/:
    get:
      operationId: admin_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - category_changed
          - commission_changed
          - commission_collected
          - complaint_updated
          - document_viewed
          - featured_cancelled
          - no_show_reviewed
          - payment_disputed
          - payment_refunded
          - payment_resolved
          - payout_paid
          - payout_rejected
          - plan_changed
          - promo_saved
          - settings_changed
          - subscription_activated
          - user_reactivated
          - user_suspended
          - worker_rejected
          - worker_verified
        description: |-
          * `worker_verified` - Worker verified
          * `worker_rejected` - Worker rejected
          * `document_viewed` - Worker document viewed
          * `user_suspended` - User suspended
          * `user_reactivated` - User reactivated
          * `commission_changed` - Commission rate changed
          * `category_changed` - Service category changed
          * `settings_changed` - Platform settings changed
          * `plan_changed` - Subscription or featured plan changed
          * `subscription_activated` - Subscription activated manually
          * `featured_cancelled` - Featured listing cancelled
          * `complaint_updated` - Complaint status changed
          * `payment_disputed` - Payment flagged as disputed
          * `payout_paid` - Worker payout marked as paid
          * `payout_rejected` - Worker payout rejected
          * `commission_collected` - Cash commission received from worker
          * `payment_resolved` - Disputed payment resolved
          * `payment_refunded` - Payment refunded to customer
          * `promo_saved` - Promo code created or changed
          * `no_show_reviewed` - No-show report reviewed
      - in: query
        name: actor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/bookings/:
    get:
      operationId: admin_bookings_list
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - arrived
          - cancelled
          - completed
          - confirmed
          - in_progress
          - on_the_way
        description: |-
          * `confirmed` - Confirmed
          * `on_the_way` - On the way
          * `arrived` - Arrived
          * `in_progress` - Work started
          * `completed` - Completed
          * `cancelled` - Cancelled
      - in: query
        name: worker
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
  /api/v1/admin/commissions/:
    get:
      operationId: admin_commissions_list
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - collected
          - pending
          - waived
        description: |-
          * `pending` - Pending collection
          * `collected` - Collected
          * `waived` - Waived
      - in: query
        name: worker
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommissionList'
          description: ''
  /api/v1/admin/complaints/:
    get:
      operationId: admin_complaints_list
      parameters:
      - in: query
        name: against_user
        schema:
          type: integer
      - in: query
        name: booking
        schema:
          type: integer
      - in: query
        name: category
        schema:
          type: string
          enum:
          - app_issue
          - behaviour
          - damage
          - fraud
          - no_show
          - other
          - overcharging
          - payment
          - service_quality
        description: |-
          * `service_quality` - Poor service quality
          * `no_show` - Worker did not arrive
          * `overcharging` - Overcharging
          * `behaviour` - Rude or unsafe behaviour
          * `payment` - Payment issue
          * `damage` - Property damage
          * `fraud` - Fraud
          * `app_issue` - App problem
          * `other` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: raised_by
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_review
          - open
          - rejected
          - resolved
        description: |-
          * `open` - Open
          * `in_review` - In review
          * `resolved` - Resolved
          * `rejected` - Rejected
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminComplaintList'
          description: ''
  /api/v1/admin/complaints/{id}/:
    get:
      operationId: admin_complaints_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this complaint.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComplaint'
          description: ''
  /api/v1/admin/complaints/{id}/status/:
    post:
      operationId: admin_complaints_status_create
      summary: Move a complaint to in_review, resolved or rejected. Audited; the reporter
        is notified.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this complaint.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComplaintStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComplaintStatusRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComplaint'
          description: ''
  /api/v1/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/documents/{id}/file/:
    get:
      operationId: admin_documents_file_retrieve
      description: Streams a private CNIC/verification document to an admin. Every
        view is audited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/admin/featured-listings/:
    get:
      operationId: admin_featured_listings_list
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - cancelled
          - expired
          - pending_payment
        description: |-
          * `pending_payment` - Awaiting payment
          * `active` - Active
          * `expired` - Expired
          * `cancelled` - Cancelled
      - in: query
        name: worker
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeaturedListingList'
          description: ''
  /api/v1/admin/featured-listings/{id}/:
    get:
      operationId: admin_featured_listings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this featured listing.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedListing'
          description: ''
  /api/v1/admin/featured-listings/{id}/cancel/:
    post:
      operationId: admin_featured_listings_cancel_create
      summary: Cancel a featured listing (e.g. policy violation). Audited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this featured listing.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SuspendUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedListing'
          description: ''
  /api/v1/admin/featured-plans/:
    get:
      operationId: admin_featured_plans_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeaturedPlan'
          description: ''
    post:
      operationId: admin_featured_plans_create
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeaturedPlanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeaturedPlanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeaturedPlanRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedPlan'
          description: ''
  /api/v1/admin/featured-plans/{id}/:
    get:
      operationId: admin_featured_plans_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this featured plan.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedPlan'
          description: ''
    patch:
      operationId: admin_featured_plans_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this featured plan.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFeaturedPlanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFeaturedPlanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFeaturedPlanRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedPlan'
          description: ''
  /api/v1/admin/no-shows/:
    get:
      operationId: admin_no_shows_list
      description: No-show reports. Each row shows how many no-shows the reported
        person has in total.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: review
        schema:
          type: string
          enum:
          - confirmed
          - dismissed
          - open
        description: |-
          * `open` - Not reviewed
          * `confirmed` - Confirmed
          * `dismissed` - Dismissed
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: side
        schema:
          type: string
          enum:
          - customer
          - worker
        description: |-
          Who did not show up.

          * `worker` - Worker did not come
          * `customer` - Customer was not there
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminNoShowList'
          description: ''
  /api/v1/admin/no-shows/{id}/:
    get:
      operationId: admin_no_shows_retrieve
      description: No-show reports. Each row shows how many no-shows the reported
        person has in total.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this no show report.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNoShow'
          description: ''
  /api/v1/admin/no-shows/{id}/review/:
    post:
      operationId: admin_no_shows_review_create
      description: No-show reports. Each row shows how many no-shows the reported
        person has in total.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this no show report.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewNoShowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewNoShowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewNoShowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNoShow'
          description: ''
  /api/v1/admin/payments/:
    get:
      operationId: admin_payments_list
      description: 'All payments. Disputed ones to resolve: `?status=disputed`. Refunded:
        `?refunded=true`.'
      parameters:
      - in: query
        name: booking
        schema:
          type: integer
      - in: query
        name: method
        schema:
          type: string
          enum:
          - cash
          - easypaisa
          - jazzcash
        description: |-
          * `cash` - Cash
          * `jazzcash` - JazzCash
          * `easypaisa` - Easypaisa
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payer
        schema:
          type: integer
      - in: query
        name: purpose
        schema:
          type: string
          enum:
          - booking
          - commission
          - featured_listing
          - subscription
        description: |-
          * `booking` - Booking
          * `subscription` - Worker subscription
          * `featured_listing` - Featured listing
          * `commission` - Commission owed by a worker
      - in: query
        name: refunded
        schema:
          type: boolean
        description: 'true: only payments with a refund'
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - disputed
          - expired
          - failed
          - pending
          - refunded
        description: |-
          * `pending` - Awaiting confirmation
          * `completed` - Completed
          * `failed` - Failed
          * `disputed` - Disputed
          * `expired` - Expired
          * `refunded` - Refunded
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPaymentList'
          description: ''
  /api/v1/admin/payments/{id}/:
    get:
      operationId: admin_payments_retrieve
      description: 'All payments. Disputed ones to resolve: `?status=disputed`. Refunded:
        `?refunded=true`.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this payment.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayment'
          description: ''
  /api/v1/admin/payments/{id}/refund/:
    post:
      operationId: admin_payments_refund_create
      description: 'All payments. Disputed ones to resolve: `?status=disputed`. Refunded:
        `?refunded=true`.'
      summary: 'After sending money back: record a full or partial refund of a completed
        booking payment, optionally charging the worker''s share to their wallet.
        Audited.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this payment.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
          description: ''
  /api/v1/admin/payments/{id}/resolve/:
    post:
      operationId: admin_payments_resolve_create
      description: 'All payments. Disputed ones to resolve: `?status=disputed`. Refunded:
        `?refunded=true`.'
      summary: 'Resolve a disputed payment after checking the merchant portal: accept,
        refund or reject. Audited.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this payment.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolvePaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolvePaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResolvePaymentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayment'
          description: ''
  /api/v1/admin/promo-codes/:
    get:
      operationId: admin_promo_codes_list
      description: 'Promo codes. There is no delete: switch a code off with `is_active:
        false` (its history stays).'
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - fixed
          - percent
        description: |-
          * `percent` - Percent off
          * `fixed` - Fixed amount off
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPromoCodeList'
          description: ''
