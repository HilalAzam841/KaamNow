components:
  schemas:
    AdminComplaint:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          type: integer
          readOnly: true
          nullable: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        subject:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ComplaintStatusEnum'
          readOnly: true
        resolution:
          type: string
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        raised_by:
          type: integer
          readOnly: true
        raised_by_name:
          type: string
          readOnly: true
        raised_by_role:
          type: string
          readOnly: true
        against_user:
          type: integer
          readOnly: true
          nullable: true
        against_user_name:
          type: string
          readOnly: true
        resolved_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - against_user
      - against_user_name
      - booking
      - category
      - created_at
      - description
      - id
      - raised_by
      - raised_by_name
      - raised_by_role
      - resolution
      - resolved_at
      - resolved_by
      - status
      - subject
      - updated_at
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_suspended:
          type: boolean
          readOnly: true
        suspended_reason:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - full_name
      - id
      - is_active
      - is_suspended
      - last_login
      - phone
      - role
      - suspended_reason
    AdminWorker:
      type: object
      description: The worker's own profile (private view).
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        cnic_number:
          type: string
          readOnly: true
        bio:
          type: string
          readOnly: true
        experience_years:
          type: integer
          readOnly: true
        profile_picture:
          type: string
          format: uri
          nullable: true
          readOnly: true
        base_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        base_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        service_area:
          type: string
          readOnly: true
          description: e.g. Gulberg, Lahore
        service_radius_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        is_available:
          type: boolean
          readOnly: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
        completed_jobs_count:
          type: integer
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/WorkerServiceInline'
          readOnly: true
        documents_uploaded:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        email:
          type: string
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/WorkerDocument'
          readOnly: true
        user_id:
          type: integer
          readOnly: true
      required:
      - average_rating
      - base_latitude
      - base_longitude
      - bio
      - cnic_number
      - completed_jobs_count
      - created_at
      - documents
      - documents_uploaded
      - email
      - experience_years
      - full_name
      - id
      - is_available
      - phone
      - profile_picture
      - rating_count
      - rejection_reason
      - service_area
      - service_radius_km
      - services
      - user_id
      - verification_status
      - verified_at
    AppConfig:
      type: object
      properties:
        api_version:
          type: string
        min_supported_version:
          type: object
          additionalProperties:
            type: string
        currency:
          type: string
