          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Overrides the platform commission for subscribers. Blank =
            platform default.
        daily_offer_limit:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: Max offers per day. Blank = unlimited.
        benefits: {}
        badge:
          type: string
          description: e.g. 'PRO' shown on the worker card.
          maxLength: 30
        is_default:
          type: boolean
          description: Plan applied to workers without a subscription.
        is_active:
          type: boolean
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - name
      - price
      - slug
    SuspendUserRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - reason
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TrailPoint:
      type: object
      properties:
        latitude:
          type: string
        longitude:
          type: string
        recorded_at:
          type: string
          format: date-time
      required:
      - latitude
      - longitude
      - recorded_at
    TypeEnum:
      enum:
      - new_request
      - new_offer
      - negotiation
      - offer_accepted
      - offer_rejected
      - offer_closed
      - booking_status
      - booking_cancelled
      - booking_completed
      - request_cancelled
      - payment
      - chat_message
      - subscription
      - featured
      - complaint
      - review
      - verification
      - system
      type: string
      description: |-
        * `new_request` - New nearby request
        * `new_offer` - New offer
        * `negotiation` - Negotiation update
        * `offer_accepted` - Offer accepted
        * `offer_rejected` - Offer rejected
        * `offer_closed` - Offer closed
        * `booking_status` - Booking status
        * `booking_cancelled` - Booking cancelled
        * `booking_completed` - Booking completed
        * `request_cancelled` - Request cancelled
        * `payment` - Payment
        * `chat_message` - New chat message
        * `subscription` - Subscription
        * `featured` - Featured listing
        * `complaint` - Complaint update
        * `review` - Review
        * `verification` - Account verification
        * `system` - System
    User:
      type: object
      description: The authenticated user's own account (includes private fields).
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        full_name:
          type: string
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        avatar:
          type: string
          format: uri
          nullable: true
        default_address:
          type: string
          maxLength: 255
        worker_profile_id:
          type: integer
          nullable: true
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - full_name
      - id
      - phone
      - role
      - worker_profile_id
    UserRoleEnum:
      enum:
      - customer
      - worker
      - admin
      type: string
      description: |-
        * `customer` - Customer
        * `worker` - Service provider
        * `admin` - Administrator
    VerificationStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `pending` - Pending review
        * `verified` - Verified
        * `rejected` - Rejected
    WorkerDocument:
      type: object
      description: Metadata only. The file itself is private and never returned as
        a URL.
      properties:
        id:
          type: integer
          readOnly: true
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        original_filename:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WorkerDocumentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - document_type
      - id
      - original_filename
      - status
    WorkerDocumentRequest:
      type: object
      description: Metadata only. The file itself is private and never returned as
        a URL.
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        file:
          type: string
          format: binary
          writeOnly: true
      required:
      - document_type
      - file
    WorkerDocumentStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    WorkerOffer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        request:
          type: integer
          readOnly: true
        worker:
          allOf:
          - $ref: '#/components/schemas/PublicWorker'
          readOnly: true
        initial_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        current_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Latest price on the table in the negotiation.
        awaiting:
          allOf:
          - $ref: '#/components/schemas/PartyEnum'
          readOnly: true
          description: |-
            Which party must respond next.

            * `customer` - Customer
            * `worker` - Worker
        estimated_arrival_minutes:
          type: integer
          readOnly: true
        message:
          type: string
          readOnly: true
        additional_info:
          type: string
          readOnly: true
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/WorkerOfferStatusEnum'
          readOnly: true
        negotiations:
          type: array
          items:
            $ref: '#/components/schemas/Negotiation'
          readOnly: true
        booking_id:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - additional_info
      - awaiting
      - booking_id
      - created_at
      - current_price
      - distance_km
      - estimated_arrival_minutes
      - id
      - initial_price
      - message
      - negotiations
      - request
      - status
      - updated_at
      - worker
    WorkerOfferStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      - withdrawn
      - closed
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected by customer
        * `withdrawn` - Withdrawn by worker
        * `closed` - Closed
    WorkerProfile:
      type: object
      description: The worker's own profile (private view).
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        cnic_number:
          type: string
          maxLength: 13
        bio:
          type: string
          maxLength: 2000
        experience_years:
          type: integer
          maximum: 60
          minimum: 0
        profile_picture:
          type: string
          format: uri
          nullable: true
        base_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        base_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        service_area:
          type: string
          description: e.g. Gulberg, Lahore
          maxLength: 255
        service_radius_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_available:
          type: boolean
          readOnly: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
        completed_jobs_count:
          type: integer
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/WorkerServiceInline'
          readOnly: true
        documents_uploaded:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - average_rating
      - cnic_number
      - completed_jobs_count
      - created_at
      - documents_uploaded
      - full_name
      - id
      - is_available
      - phone
      - rating_count
      - rejection_reason
      - services
      - verification_status
      - verified_at
    WorkerService:
