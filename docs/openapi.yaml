        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - balance
      - commission_owed
      - earnings_held
      - worker
      - worker_name
      - worker_phone
    WorkerDocument:
      type: object
      description: Metadata only. The file itself is private and never returned as
        a URL.
      properties:
        id:
          type: integer
          readOnly: true
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        original_filename:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/WorkerDocumentStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - document_type
      - id
      - original_filename
      - status
    WorkerDocumentRequest:
      type: object
      description: Metadata only. The file itself is private and never returned as
        a URL.
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        file:
          type: string
          format: binary
          writeOnly: true
      required:
      - document_type
      - file
    WorkerDocumentStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `approved` - Approved
        * `rejected` - Rejected
    WorkerLevelEnum:
      enum:
      - new
      - rising
      - trusted
      - top_rated
      type: string
      description: |-
        * `new` - New
        * `rising` - Rising
        * `trusted` - Trusted
        * `top_rated` - Top rated
    WorkerOffer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        request:
          type: integer
          readOnly: true
        worker:
          allOf:
          - $ref: '#/components/schemas/PublicWorker'
          readOnly: true
        initial_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        current_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Latest price on the table in the negotiation.
        awaiting:
          allOf:
          - $ref: '#/components/schemas/PartyEnum'
          readOnly: true
          description: |-
            Which party must respond next.

            * `customer` - Customer
            * `worker` - Worker
        estimated_arrival_minutes:
          type: integer
          readOnly: true
        message:
          type: string
          readOnly: true
        additional_info:
          type: string
          readOnly: true
        distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/WorkerOfferStatusEnum'
          readOnly: true
        negotiations:
          type: array
          items:
            $ref: '#/components/schemas/Negotiation'
          readOnly: true
        booking_id:
          type: integer
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - additional_info
      - awaiting
      - booking_id
      - created_at
      - current_price
      - distance_km
      - estimated_arrival_minutes
      - id
      - initial_price
      - message
      - negotiations
      - request
      - status
      - updated_at
      - worker
    WorkerOfferStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      - withdrawn
      - closed
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected by customer
        * `withdrawn` - Withdrawn by worker
        * `closed` - Closed
    WorkerProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        cnic_number:
          type: string
          maxLength: 13
        bio:
          type: string
          maxLength: 2000
        experience_years:
          type: integer
          maximum: 60
          minimum: 0
        profile_picture:
          type: string
          format: uri
          nullable: true
        base_latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        base_longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        service_area:
          type: string
          description: e.g. Gulberg, Lahore
          maxLength: 255
        service_radius_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        is_available:
          type: boolean
          readOnly: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        rating_count:
          type: integer
          readOnly: true
        completed_jobs_count:
          type: integer
          readOnly: true
        level:
          allOf:
          - $ref: '#/components/schemas/WorkerLevelEnum'
          readOnly: true
          description: |-
            Worked out from jobs, ratings and reliability (apps.levels). Not set by hand.

            * `new` - New
            * `rising` - Rising
            * `trusted` - Trusted
            * `top_rated` - Top rated
        badges:
          type: array
          items:
            type: string
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/WorkerServiceInline'
          readOnly: true
        documents_uploaded:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - average_rating
      - badges
      - cnic_number
      - completed_jobs_count
      - created_at
      - documents_uploaded
      - full_name
      - id
      - is_available
      - level
      - phone
      - rating_count
      - rejection_reason
      - services
      - verification_status
      - verified_at
