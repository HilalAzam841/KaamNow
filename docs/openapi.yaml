      - user_reactivated
      - commission_changed
      - category_changed
      - settings_changed
      - plan_changed
      - subscription_activated
      - featured_cancelled
      - complaint_updated
      - payment_disputed
      - payout_paid
      - payout_rejected
      - commission_collected
