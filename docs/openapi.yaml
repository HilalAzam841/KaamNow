          format: time
        end:
          type: string
          format: time
      required:
      - end
      - start
      - weekday
    WorkingHoursRequest:
      type: object
      properties:
        weekday:
          allOf:
          - $ref: '#/components/schemas/WeekdayEnum'
          minimum: 0
          maximum: 32767
        start:
          type: string
          format: time
        end:
          type: string
          format: time
      required:
      - end
      - start
      - weekday
